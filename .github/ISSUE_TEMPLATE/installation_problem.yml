name: Installation or startup problem
description: Report a problem downloading, extracting, starting, or accessing the tool.
title: "[Installation]: "
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, cookies, private URLs, customer data, or unredacted logs.
  - type: input
    id: tool-version
    attributes:
      label: Migration Tool version
      placeholder: v7.25.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and architecture.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps performed
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted error output
